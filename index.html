<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Buscar Pokémon</title>
</head>
<body>

    <main>
        <h1>Buscar Pokémon</h1>

        <form id="formPoke">
            <input
            type="number"
            id="idPoke"
            placeholder="Digite o ID"
            min="1"
            required>

            <button type="submit">Buscar</button>
        </form>

        <p id="msg"></p>

        <!-- Carta do Pokémon -->
        <div id="resultado">
            <h2 id="nomePokemon"></h2>
            <img src="" alt="Imagem do Pokémon" id="imgPoke">
            
            <div class="status-container">
                <p><strong>Exp. Base:</strong> <span id="basePoke"></span></p>
                <p><strong>Tipo:</strong> <span id="tipoPoke"></span></p>
                <p><strong>HP:</strong> <span id="hpPoke"></span></p>
                <p><strong>Ataque:</strong> <span id="ataquePoke"></span></p>
            </div>
        </div>

    </main>  
   
    <script src="main.js"></script>
</body>
</html>
